---
common:
  msg_source: 1                         # 0: not use Lidar
                                       # 1: packet message comes from online Lidar
                                       # 2: packet message comes from ROS or ROS2
                                       # 3: packet message comes from Pcap file
  send_packet_ros: false               # true: Send packets through ROS or ROS2(Used to record packet)
  send_point_cloud_ros: true           # true: Send point cloud through ROS or ROS2

lidar:
  - driver:
      lidar_type: RS16                 # LiDAR type - RS16, RS32, RSBP, RSAIRY, ...
      device_ip: 192.168.1.203         # LiDAR IP address
      msop_port: 6702                  # Msop port of lidar
      difop_port: 7791                 # Difop port of lidar
      imu_port: 0                      # IMU port of lidar(only for RSAIRY, RSE1), 0 means no imu.
                                       # If you want to use IMU, set ENABLE_IMU_DATA_PARSE to ON in CMakeLists.txt 
      user_layer_bytes: 0              # Bytes of user layer. There is no user layer if 0
      tail_layer_bytes: 0              # Bytes of tail layer. There is no tail layer if 0
      min_distance: 0.2                # Minimum distance of point cloud
      max_distance: 200                # Maximum distance of point cloud
      use_lidar_clock: true            # true--Use the lidar clock as timestamp; false--use system clock
      dense_points: false              # true: discard NAN points; false: reserve NAN points
      ts_first_point: true             # true: time-stamp point cloud with the first point; false: with the last point
      start_angle: 0                   # Start angle of point cloud
      end_angle: 360                   # End angle of point cloud
      pcap_repeat: true                # Used only if msg_source = 3
      pcap_rate: 1.0                   # Playback rate of the pcap file
      pcap_path: /home/robosense/lidar.pcap # Path of pcap file

    ros:
      ros_frame_id: rslidar                         # Frame id of point cloud
      ros_recv_packet_topic: /rslidar_packets       # Topic to receive packets
      ros_send_packet_topic: /rslidar_packets       # Topic to send packets
      ros_send_imu_data_topic: /rslidar_imu_data    # Topic to send IMU data
      ros_send_point_cloud_topic: /rslidar_points   # Topic to send point cloud
      ros_queue_length: 100                         # ROS topic queue size

